name: Prune stale branches

# Deletes branches that are done (merged into master, or released: a patch/x.y.z branch whose tip is in a v* tag)
# AND whose last commit is over a week old (scripts/prune-stale-branches.sh). Runs on every branch push rather than on
# a schedule, so it only does work while the repo is active: after a quiet spell the old branches are all still there,
# and the first push back cleans up. The week is grace for follow-ups. master, tags and unfinished branches are never
# touched. A deleted branch can be restored from its PR page; its commits are in master or a tag either way.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prune-stale-branches
  cancel-in-progress: true

jobs:
  prune:
    # A branch deletion is also a push event; nothing to do for those.
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/prune-stale-branches.sh ${{ inputs.dry_run && '--dry-run' || '' }}
