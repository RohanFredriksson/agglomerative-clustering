name: Published package

# Installs a version from the npm registry into fresh projects and checks it loads everywhere people load it
# (test/published/smoke.mjs), on Linux, Windows and macOS. Runs after each publish, and on demand for any version or tag.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  # A change to the smoke test itself is checked against the version in package.json, which is already published.
  pull_request:
    paths: [test/published/**, test/browser/**, .github/workflows/published.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version or dist-tag to test
        required: true
        default: next

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Which version
        shell: bash
        run: echo "VERSION=${{ inputs.version || '' }}" >> "$GITHUB_ENV"; if [ -z "${{ inputs.version }}" ]; then echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - name: Wait for the registry
        shell: bash
        run: for i in $(seq 1 30); do npm view "agglomerative-clustering@$VERSION" version && exit 0; sleep 20; done; exit 1
      - run: node test/published/smoke.mjs ${{ env.VERSION }}

  # The published package bundled with Vite and webpack and run in Chromium, Firefox and WebKit (test/browser/run.mjs with
  # PACKAGE): the files a bundler takes from the tarball, rather than from this checkout.
  browsers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Which version
        run: echo "VERSION=${{ inputs.version || '' }}" >> "$GITHUB_ENV"; if [ -z "${{ inputs.version }}" ]; then echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - name: Wait for the registry
        run: for i in $(seq 1 30); do npm view "agglomerative-clustering@$VERSION" version && exit 0; sleep 20; done; exit 1
      - run: npm ci
      - name: Install Firefox and WebKit
        run: npx -y playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps firefox webkit
      - run: npm run test:browser
        env:
          BROWSERS: chromium,firefox,webkit
          PACKAGE: agglomerative-clustering@${{ env.VERSION }}
