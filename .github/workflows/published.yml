name: Published package

# Installs a version from the npm registry into fresh projects and checks it loads everywhere people load it
# (test/published/smoke.mjs), on Linux, Windows and macOS. Runs after each publish, and on demand for any version or tag.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  # A change to the smoke test itself is checked against the version in package.json, which is already published.
  pull_request:
    paths: [test/published/**, test/browser/**, .github/workflows/published.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version or dist-tag to test
        required: true
        default: next

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Which version
        shell: bash
        run: echo "VERSION=${{ inputs.version || '' }}" >> "$GITHUB_ENV"; if [ -z "${{ inputs.version }}" ]; then echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - name: Wait for the registry
        shell: bash
        run: |
          # Until the tarball itself downloads: the registry lists a new version a minute or so before its tarball is
          # served, and installing in between fails with a 404 (as all six smoke jobs did for 3.1.0).
          for i in $(seq 1 30); do
            url=$(npm view "agglomerative-clustering@$VERSION" dist.tarball 2>/dev/null)
            [ -n "$url" ] && node -e "fetch(process.argv[1], {method: 'HEAD'}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" "$url" && exit 0
            sleep 20
          done
          exit 1
      - run: node test/published/smoke.mjs ${{ env.VERSION }}

  # The published package bundled with Vite and webpack and run in Chromium, Firefox and WebKit (test/browser/run.mjs with
  # PACKAGE): the files a bundler takes from the tarball, rather than from this checkout.
  # The playwright-core version the lockfile pins, for the browser job's container (see the browser job in ci.yml).
  playwright:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

  # The bundled browser checks against the published package, in Playwright's image, which has the browsers and their
  # system libraries (installing those on the runner took 15 minutes, fetching Ubuntu packages from a slow mirror).
  browsers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: playwright
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    env:
      # Firefox won't start as root when HOME belongs to another user, which GitHub's container HOME (/github/home) does.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Which version
        run: echo "VERSION=${{ inputs.version || '' }}" >> "$GITHUB_ENV"; if [ -z "${{ inputs.version }}" ]; then echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - name: Wait for the registry
        run: |
          # Until the tarball itself downloads: the registry lists a new version a minute or so before its tarball is
          # served, and installing in between fails with a 404 (as all six smoke jobs did for 3.1.0).
          for i in $(seq 1 30); do
            url=$(npm view "agglomerative-clustering@$VERSION" dist.tarball 2>/dev/null)
            [ -n "$url" ] && node -e "fetch(process.argv[1], {method: 'HEAD'}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" "$url" && exit 0
            sleep 20
          done
          exit 1
      - run: npm ci
      - run: npm run test:browser
        env:
          BROWSERS: chromium,firefox,webkit
          PACKAGE: agglomerative-clustering@${{ env.VERSION }}
