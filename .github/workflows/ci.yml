name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node versions in `engines` (require(esm), which the CommonJS build needs) and the current LTS.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Cache Kodak images
        uses: actions/cache@v4
        with:
          path: fixtures/images
          key: kodak-${{ hashFiles('fixtures/kodak.js') }}

      - run: npm ci
      - run: npm run build
      - run: npm test
