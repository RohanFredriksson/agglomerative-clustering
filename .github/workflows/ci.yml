name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Cache Kodak images
        uses: actions/cache@v4
        with:
          path: fixtures/images
          key: kodak-${{ hashFiles('fixtures/kodak.js') }}

      - run: npm ci
      - run: npm run build
      - run: npm test
