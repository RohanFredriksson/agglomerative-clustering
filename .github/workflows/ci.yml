name: CI

on:
  push:
    branches: [master, 'patch/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # A fixed Ubuntu rather than ubuntu-latest, so a new runner image doesn't change the build under us.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node versions in `engines` (require(esm), which the CommonJS build needs) and the current LTS.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Cache Kodak images
        uses: actions/cache@v4
        with:
          path: fixtures/images
          key: kodak-${{ hashFiles('fixtures/kodak.js') }}

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The build for the Windows job, which has no Emscripten.
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dist
          path: dist
          retention-days: 3

      # Compiles consumer code against the built declarations under nodenext (ESM and CommonJS) and bundler resolution.
      - run: npm run test:types

      # The same consumer code on the oldest TypeScript the declarations support (5.2, the first with `await using`), so an
      # accidental use of a newer type feature fails here; and on the newest, as an early warning (it may fail first for
      # reasons outside this repo, so it doesn't block).
      - name: Types on TypeScript 5.2
        run: for config in nodenext bundler node; do npx -y -p typescript@5.2.2 tsc -p test/types/tsconfig.$config.json; done
      - name: Types on the latest TypeScript
        continue-on-error: true
        run: for config in nodenext bundler node; do npx -y -p typescript@latest tsc -p test/types/tsconfig.$config.json; done


  # The playwright-core version the lockfile pins, for the browser job's container: Playwright's images are tagged by
  # version, and each only has the browsers that version drives.
  playwright:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

  # Bundles a page with Vite, webpack and Parcel and runs it in Chromium, Firefox and WebKit: the worker and the .wasm as browsers
  # get them, against the Linux job's build. In Playwright's own image, which has the browsers and their system libraries:
  # installing those libraries on the runner (playwright install --with-deps) took 15 minutes, nearly all of it fetching
  # Ubuntu packages from a slow mirror.
  browsers:
    needs: [test, playwright]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    env:
      # Firefox won't start as root when HOME belongs to another user, which GitHub's container HOME (/github/home) does.
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - run: npm ci
      - run: npm run test:browser
        env:
          BROWSERS: chromium,firefox,webkit

  # The test suite on Windows (paths, line endings, spawning Node), against the Linux job's build: the .wasm and the
  # transpiled JS are the same files on every platform, so only the tests' own platform assumptions are new here.
  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      # Keep LF line endings, as on every other platform (the README and fixture checks read files as text).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Kodak images
        uses: actions/cache@v4
        with:
          path: fixtures/images
          key: kodak-windows-${{ hashFiles('fixtures/kodak.js') }}

      - run: npm ci
      - run: npm test

  # The same browser checks in the real Safari, which only runs on macOS (Playwright's WebKit is close to it, not it).
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - run: npm ci
      - run: npm run build
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - run: npm run test:browser
        env:
          BROWSERS: safari

  # Native fuzzing of the C++ with ASan and UBSan (scripts/native.sh): stored clusterings come back from users as
  # untrusted bytes, and the image functions must keep their invariants (sliced clustering equals one-shot, indices point
  # into the palette) for every input the JavaScript lets through. Two minutes per target on each push.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (with libFuzzer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - run: scripts/native.sh fuzz 120
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: |
            crash-*
            leak-*
            timeout-*
          retention-days: 14
