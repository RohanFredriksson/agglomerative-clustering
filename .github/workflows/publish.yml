name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Cache Kodak images
        uses: actions/cache@v4
        with:
          path: fixtures/images
          key: kodak-${{ hashFiles('fixtures/kodak.js') }}

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:types

      # Prereleases go to `next`; a patch to an older line (3.1.2 from release/3.1.x after 3.2.0) goes to `v3.1-latest`
      # instead of taking `latest` back (scripts/dist-tag.mjs). A failed lookup of `latest` stops the publish rather
      # than guessing.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(npm view --prefer-online agglomerative-clustering dist-tags.latest)
          tag=$(node scripts/dist-tag.mjs "$version" "$latest")
          echo "Publishing $version under the dist-tag $tag (latest is $latest)"
          npm publish --tag "$tag" --ignore-scripts
